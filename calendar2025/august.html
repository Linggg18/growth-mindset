<head>

  <title>August 2025</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Baloo 2', cursive;
      background: linear-gradient(to bottom right, #fffaf0, #ffd6d6);
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #ff5c8d;
      margin-bottom: 20px;
      text-shadow: 1px 1px 2px #ffb3bf;
      font-size: 2.5em;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .day-box {
      background: #ffd6d6;
      border: 2px solid #ff5c8d;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 3px 3px 8px #ff8aa9;
      transition: transform 0.2s;
    }

    .day-box:hover {
      transform: scale(1.05);
    }

    .day-box h2 {
      margin: 0 0 10px 0;
      color: #d81e5b;
      font-size: 1.4em;
    }

    .day-box h2::before {
      content: "🍓 ";
    }

    textarea {
      width: 100%;
      height: 120px;
      border: 1px solid #ff5c8d;
      border-radius: 10px;
      padding: 10px;
      font-size: 1em;
      resize: vertical;
      background-color: #fff0f5;
      font-family: 'Baloo 2', cursive;
    }

    textarea::placeholder {
      color: #d81e5b;
      font-style: italic;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 0.9em;
      color: #777;
    }
  </style>
</head>
